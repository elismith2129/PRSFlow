<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c-bg:#0b0a09; --c-fg:#f2efe7;
  --c-wash:rgba(242,239,231,.06); --c-wash2:rgba(242,239,231,.12);
  --c-fg-2:rgba(242,239,231,.72); --c-fg-3:rgba(242,239,231,.45);
  --c-chip-ink:#1c2626; --c-ivory:#d5d0c2; --c-hot-text:#fff4f2;
  --c-st-hot:#ff5a4d; --c-st-warm:#ffa94d; --c-st-cold:#5fc9e8; --c-st-booked:#43dfae;
  --c-st-uncon:#7fb2e5; --c-st-tech:#b5a3ef; --c-st-dead:#cfd6d4; --c-st-tenant:#2ee8fd;
  --c-srf:#151412;
  --c-softsh:0 2px 5px rgba(0,0,0,.25), 0 8px 22px rgba(0,0,0,.22);
  --c-ctlsh:0 1px 4px rgba(0,0,0,.3);
  --c-flo-ink:242,239,231;
}
[data-theme="light"]{
  --c-bg:#fdfcf9; --c-fg:#1a1712;
  --c-wash:rgba(26,23,18,.055); --c-wash2:rgba(26,23,18,.105);
  --c-fg-2:rgba(26,23,18,.72); --c-fg-3:rgba(26,23,18,.46);
  --c-srf:#f1efe9;
  --c-softsh:0 1px 2px rgba(26,23,18,.05), 0 4px 12px rgba(26,23,18,.05);
  --c-ctlsh:0 1px 3px rgba(26,23,18,.12);
  --c-flo-ink:26,23,18;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--c-bg);color:var(--c-fg);font:400 14px/1.5 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
/* The walkthrough stage the screen sits in (the SOP supplies this; do not restyle it). */
.stage{max-width:__WIDTH__px;margin:16px auto;padding:14px;border-radius:18px;background:var(--c-bg);box-shadow:inset 0 0 0 1px var(--c-wash2);overflow:hidden}
.scr{position:relative}
</style>
</head>
<body>
<div class="stage">
