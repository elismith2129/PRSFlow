<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRSFlo — Ribbon Aurora: AB1–AB8</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono&display=swap" rel="stylesheet">
<!--
  RIBBON AURORA (2026-09-06) — the synthesis round: THE RIBBON, MADE OF DOTS,
  FEELING LIKE AURORA BOREALIS. Confined strictly to the Flo band (every tile
  clips; the build clips the zone with overflow:hidden — no bleed into the
  cards). Gentle motion where noted: shimmer/sway at borealis speed.
  Grid format — scan, name keepers. Sample text in every tile.

  AB1 · DOT RIBBON      RB8's placement, the mark in halftone dots, aurora
                        vertical fade (bright core, dissolving upward)
  AB2 · CURTAINS        dot columns RISING from the ribbon's wave like
                        aurora curtains, fading with height (static)
  AB3 · FULL WRAP       the E2 wrap composition, rendered in dots
  AB4 · SHIMMER         AB1 + per-dot twinkle at borealis speed (motion)
  AB5 · DUAL TONE       green core, harbor-blue fringe at the top edge —
                        real aurora colouring (⚠ second colour)
  AB6 · DISSOLVE        dense dots at the wave, scattering into sky above
  AB7 · SWAYING CURTAIN AB2 + the columns lean slowly side to side (motion)
  AB8 · THE FINALIST    my tuned blend: dot ribbon + short curtains +
                        slow shimmer, whisper alpha (motion)
-->
<style>
:root{
  --stage:#0b0a09; --card:#151412;
  --ink:#f2efe7; --ink2:rgba(242,239,231,.6); --ink3:rgba(242,239,231,.34);
  --hot:#ff5a4d; --ok:#43dfae;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--stage);color:var(--ink);
  font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px 60px}
.label{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
h1{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:20px;letter-spacing:-.02em;padding:4px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{position:relative;overflow:hidden;border-radius:16px;background:#0d0c0a;height:200px}
.tile canvas{position:absolute;inset:0;width:100%;height:100%}
.tile .tag{position:absolute;top:10px;right:12px;z-index:2;font-family:'DM Mono',monospace;
  font-size:10px;color:var(--ink3)}
.tile .content{position:relative;z-index:1;padding:18px 20px}
.fhead{display:flex;align-items:center;gap:8px;padding-bottom:5px}
.fname{font-family:'Archivo Black',sans-serif;font-size:12px}
.ln{display:block;font-size:14.5px;font-weight:600;line-height:1.45;color:var(--ink2);max-width:66%}
.ln b{font-family:'Archivo Black',sans-serif;font-weight:400;color:var(--ink)}
.ln.red,.ln.red b{color:var(--hot)}
.desc{position:absolute;bottom:9px;left:20px;z-index:2;font-size:9px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">
  <span class="label">The ribbon in dots · aurora borealis energy · confined to the Flo band</span>
  <h1>Ribbon Aurora · AB1–AB8</h1>
  <div class="grid" id="grid"></div>
</div>

<script>
var RIB='M 14 100 Q 70 -10 113 100 Q 156 210 186 100 Q 156 130 113 100 Q 70 70 14 100 Z';
var G='67,223,174', B='127,178,229';
function content(){
  return '<div class="content">'
    +'<div class="fhead"><svg width="18" height="18" viewBox="0 0 200 200"><path d="'+RIB+'" fill="#43dfae"/></svg>'
    +'<span class="fname">Flo</span><span class="label">· Sep 6</span></div>'
    +'<span class="ln red"><b>Aaron is 8 days behind on COD invoicing.</b></span>'
    +'<span class="ln">We landed <b>Kestrel, Gamma Media & 10 Summers</b> today.</span>'
    +'</div>';
}
var DEFS=[
  ['AB1','Dot ribbon · aurora fade','ab1',false],
  ['AB2','Curtains rising from the wave','ab2',false],
  ['AB3','Full wrap in dots','ab3',false],
  ['AB4','Shimmer · twinkling dots','ab4',true],
  ['AB5','Dual tone · green + blue fringe','ab5',false],
  ['AB6','Dissolve · dots scatter to sky','ab6',false],
  ['AB7','Swaying curtains','ab7',true],
  ['AB8','The finalist · ribbon + curtains + shimmer','ab8',true],
];
document.getElementById('grid').innerHTML = DEFS.map(function(d){
  return '<div class="tile"><canvas data-draw="'+d[2]+'"></canvas>'+content()
    +'<span class="tag">'+d[0]+'</span><span class="desc">'+d[1]+'</span></div>';
}).join('');

function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var t=0;

/* Sample the ribbon path (upper + lower boundary per param u) so we can fill
   the mark's interior with dots. In 200-space:
   top edge:    y = 100 + sin(uπ)·(-86)   (crest of the first lobe)
   bottom edge: swings down through the second lobe. Approximation that reads
   as the mark at halftone scale. */
function ribbonBand(u){
  var top = 100 - Math.sin(u*Math.PI)*86*(u<.55?1:.55);
  var bot = 100 + Math.sin(u*Math.PI)*86*(u>.45?1:.4);
  return [top,bot];
}
/* place the mark in tile-space: right-anchored (like RB8) unless full=true */
function place(cv,u,yy,full){
  var W=cv.width,H=cv.height;
  if(full) return [u*W*1.06-W*.03, yy/200*H*1.15-H*.06];
  return [W*.42+u*W*.62, yy/200*H*1.1-H*.03];
}

function drawDots(cv,ctx,opts){
  var W=cv.width,H=cv.height,dpr=devicePixelRatio;
  ctx.clearRect(0,0,W,H);
  var N=opts.cols||64, ROWS=opts.rows||10;
  for(var i=0;i<=N;i++){
    var u=i/N;
    var band=ribbonBand(u);
    for(var j=0;j<ROWS;j++){
      var v=j/(ROWS-1);
      var yy=band[0]+(band[1]-band[0])*v;
      var pos=place(cv,u,yy,opts.full);
      var x=pos[0],y=pos[1];
      if(x<-10||x>W+10||y<-10||y>H+10) continue;
      var seed=i*31+j*7;
      /* aurora vertical fade: bright toward the band's bottom, dissolving up */
      var fade=opts.invert? v : (1-v);
      var a=opts.base + fade*opts.gain + (rnd(seed)-.5)*.02;
      if(opts.shimmer) a*= .55 + .45*Math.sin(t*(.5+rnd(seed)*1.2)+seed);
      if(opts.dissolve && v<.5){
        if(rnd(seed*3)> (v*2)*.9+.1) continue;
        var scat=(rnd(seed*5)-.5)*H*.3*(1-v*2);
        y-=Math.abs(scat);
      }
      if(a<=0.008) continue;
      var col=G;
      if(opts.dual && v<.3) col=B;
      var jx=(rnd(seed*2)-.5)*4*dpr, jy=(rnd(seed*4)-.5)*4*dpr;
      if(opts.sway){ jx += Math.sin(t*.3+u*5)* (1-v)*7*dpr; }
      ctx.fillStyle='rgba('+col+','+a.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(x+jx,y+jy,(0.8+rnd(seed*9)*1.2+fade*.6)*dpr,0,7); ctx.fill();
    }
  }
  /* curtains: columns rising from the band's TOP edge */
  if(opts.curtains){
    for(var i=0;i<=N;i+=2){
      var u=i/N;
      var band=ribbonBand(u);
      var basepos=place(cv,u,band[0],opts.full);
      var colH=(0.5+rnd(i*13)*0.5)*H*.42*(opts.curtainScale||1);
      var lean=opts.sway? Math.sin(t*.25+u*4)*10*dpr : 0;
      var steps=7;
      for(var k=1;k<=steps;k++){
        var q=k/steps;
        var a=(opts.curtainA||.10)*(1-q)*(0.6+rnd(i*7)*0.4);
        if(opts.shimmer) a*=.55+.45*Math.sin(t*(.4+rnd(i)*1)+i);
        if(a<=0.008) continue;
        ctx.fillStyle='rgba('+(opts.dual&&q>.6?B:G)+','+a.toFixed(3)+')';
        ctx.beginPath();
        ctx.arc(basepos[0]+lean*q,basepos[1]-q*colH,(0.7+(1-q))*dpr,0,7);
        ctx.fill();
      }
    }
  }
}

var CONF={
  ab1:{base:.03,gain:.15,rows:11},
  ab2:{base:.025,gain:.10,rows:6,curtains:true,curtainA:.12,curtainScale:1.15},
  ab3:{base:.025,gain:.12,rows:10,full:true},
  ab4:{base:.03,gain:.16,rows:11,shimmer:true},
  ab5:{base:.03,gain:.14,rows:11,dual:true},
  ab6:{base:.03,gain:.14,rows:12,dissolve:true},
  ab7:{base:.02,gain:.08,rows:5,curtains:true,curtainA:.13,curtainScale:1.25,sway:true},
  ab8:{base:.025,gain:.12,rows:9,curtains:true,curtainA:.08,curtainScale:.8,shimmer:true},
};
var canvases=[];
document.querySelectorAll('canvas[data-draw]').forEach(function(cv){
  var r=cv.parentElement.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio;
  canvases.push({cv:cv,ctx:cv.getContext('2d'),opts:CONF[cv.dataset.draw]});
});
function frame(){
  canvases.forEach(function(c){
    if(!reduced || t===0) drawDots(c.cv,c.ctx,c.opts);
  });
  t+=0.016;
  if(!reduced) requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
