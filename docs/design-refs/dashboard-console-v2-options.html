<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRSFlo — Dashboard v2: Pipeline + studios, 3 arrangements</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<!--
  DASHBOARD v2 OPTIONS (2026-08-07) — Eli's brief:
  · 4 studio cards return (session counts per venue)
  · "Needs Action" renamed PIPELINE — big count, and a LOUD new-inquiry alert
  · Flo on top; My Day and My Tasks SIDE BY SIDE under it (two stacked to-do
    lists bury the bottom one)
  · everything capped, one page

  OPTION A — COMMAND ROW: pipeline + 4 studio cards as a full-width top strip;
             console (Flo → My Day | Tasks) left, sessions right; staff grid +
             flags pinned under the console.
  OPTION B — SIGNAL RAIL: narrow left column of signals (pipeline, studios 2×2,
             flags); wide console center with staff grid at its foot; sessions right.
  OPTION C — STUDIO STRIP: slim studio strip on top; console left; middle =
             pipeline + flags + staff grid; sessions right.

  Mock polarity: light on :root, dark via data-theme="dark". App inverts.
-->
<style>
:root{
  --bg:#f5f3ee; --fg:#2a2722;
  --wash:rgba(42,39,34,.05); --wash2:rgba(42,39,34,.095);
  --chip-ink:#1c2626;
  --st-hot:#ff5a4d; --hot-text:#fff4f2;
  --st-warm:#ffa94d; --st-cold:#5fc9e8; --st-booked:#43dfae;
  --st-uncon:#7fb2e5; --st-dead:#cfd6d4;
  --ivory:#d5d0c2; --flo-ink:42,39,34;
}
[data-theme="dark"]{
  --bg:#1b1a17; --fg:#d9d6cd;
  --wash:rgba(217,214,205,.07); --wash2:rgba(217,214,205,.13);
  --flo-ink:213,208,194;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font:400 14px/1.5 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s}
button{font:inherit;color:var(--fg);background:none;border:none}
.arch{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.label{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

.frame{display:flex;min-height:100vh}
.rail{width:176px;flex-shrink:0;padding:14px 8px 12px 10px;display:flex;flex-direction:column;
  gap:2px;background:var(--wash)}
.rail .wm{font-family:'Archivo Black',sans-serif;letter-spacing:-.02em;font-size:15px;padding:2px 10px 10px}
.rail .wm .flo{opacity:.45}
.rail a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:11px;
  font-size:12.5px;font-weight:600;color:var(--fg);opacity:.55;text-decoration:none;cursor:pointer}
.rail a.on{opacity:1;background:var(--fg);color:var(--bg);box-shadow:2px 2px 7px rgba(0,0,0,.35)}
[data-theme="dark"] .rail a.on{background:var(--ivory);color:#1b1a17}
.main{flex:1;min-width:0;padding:14px 20px 20px}

.hbar{display:flex;align-items:center;gap:16px;padding:2px 4px 14px}
.hbar h1{font-family:'Archivo Black',sans-serif;font-size:26px;letter-spacing:-.03em;line-height:1.05}
.hbar .grow{flex:1}
.datechip{background:var(--wash2);border-radius:99px;padding:9px 16px;
  font-family:'Archivo Black',sans-serif;font-size:14px;text-align:center;flex-shrink:0}
[data-theme="light"] .datechip{background:var(--fg);color:var(--bg)}
.datechip small{display:block;font-size:9.5px;opacity:.6;font-family:system-ui;font-weight:800;letter-spacing:.1em}

.pane{background:var(--bg);border-radius:20px;overflow:hidden;padding:12px;
  box-shadow:inset 5px 5px 14px rgba(0,0,0,.35), inset -5px -5px 14px rgba(255,255,255,.03)}
[data-theme="light"] .pane{box-shadow:inset 5px 5px 14px rgba(42,39,34,.08), inset -5px -5px 14px rgba(255,255,255,.7)}
.lozenge{display:flex;align-items:baseline;justify-content:space-between;border-radius:99px;
  padding:7px 14px;margin-bottom:10px;font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;background:var(--wash2)}
[data-theme="light"] .lozenge{background:var(--fg);color:var(--bg)}

/* FLO */
.ringwrap{position:relative;border-radius:15px;overflow:hidden;padding:1.5px;margin-bottom:8px;
  box-shadow:0 0 16px 3px rgba(var(--flo-ink),.045)}
.ringwrap::before{content:"";position:absolute;inset:-120%;
  background:conic-gradient(rgba(var(--flo-ink),.06) 0deg, rgba(var(--flo-ink),.32) 90deg,
    rgba(var(--flo-ink),.06) 200deg, rgba(var(--flo-ink),.06) 360deg);
  animation:flospin 8s linear infinite}
@keyframes flospin{to{transform:rotate(360deg)}}
.ringwrap .inner{position:relative;border-radius:13.5px;background:var(--bg);padding:10px 12px}
.flohead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.flohead .fname{font-family:'Archivo Black',sans-serif;font-size:13px}
.flohead .ftag{font-size:7.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.45}
.fb .b{display:flex;gap:8px;align-items:baseline;font-size:12px;line-height:1.45;margin-bottom:4px}
.fb .b .dot{position:relative;top:-1px;width:7px;height:7px}
.fb .b.alert{color:var(--st-hot);font-weight:600}
.fb .syn{font-size:11px;opacity:.55;font-style:italic;margin-top:3px}
.fb .askflo{margin-top:7px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.4}

/* console two-up: My Day | My Tasks side by side */
.twoup{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.subhead{display:flex;align-items:center;justify-content:space-between;padding:8px 3px 4px}
.subhead b{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.4}
.item{display:flex;align-items:center;gap:8px;padding:4px 3px;font-size:12px}
.bx{width:14px;height:14px;border-radius:5px;flex-shrink:0;box-shadow:inset 2px 2px 5px rgba(0,0,0,.35)}
[data-theme="light"] .bx{box-shadow:inset 2px 2px 5px rgba(42,39,34,.2)}
.item.done .bx{background:var(--st-booked);box-shadow:none;position:relative}
.item.done .bx::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;color:var(--chip-ink)}
.item.done .tx{text-decoration:line-through;opacity:.45}
.tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-family:ui-monospace,Menlo,monospace;font-size:9px;opacity:.5;flex-shrink:0}
.due{background:var(--st-hot);color:var(--hot-text);border-radius:99px;padding:2px 7px;
  font-size:7px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.prog{font-family:ui-monospace,Menlo,monospace;font-size:10px;
  background:rgba(255,169,77,.2);color:var(--st-warm);border-radius:99px;padding:2px 8px}
.trow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:11px;font-size:12px;
  background:var(--bg);margin-bottom:5px;
  box-shadow:inset 3px 3px 9px rgba(0,0,0,.34), inset -3px -3px 9px rgba(255,255,255,.03)}
[data-theme="light"] .trow{box-shadow:inset 3px 3px 8px rgba(42,39,34,.07), inset -3px -3px 8px rgba(255,255,255,.65)}
.trow .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:10px;opacity:.5;padding:0 3px 4px}
.addrow{margin-top:4px;background:var(--wash2);border-radius:10px;padding:5px;text-align:center;
  font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.55;cursor:pointer}

/* ===== PIPELINE — the big signal ===== */
.pipe{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:20px;cursor:pointer;
  background:var(--bg);
  box-shadow:inset 5px 5px 14px rgba(0,0,0,.35), inset -5px -5px 14px rgba(255,255,255,.03)}
[data-theme="light"] .pipe{box-shadow:inset 5px 5px 14px rgba(42,39,34,.08), inset -5px -5px 14px rgba(255,255,255,.7)}
.pipe .toprow{display:flex;align-items:center;gap:14px}
.pipe .num{font-family:'Archivo Black',sans-serif;font-size:44px;letter-spacing:-.02em;line-height:1}
.pipe .body{flex:1;min-width:0}
.pipe .name{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.55}
.pipe .sub{font-size:11px;opacity:.6;margin-top:2px}
.pipe .go{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.4;flex-shrink:0;align-self:flex-start}
/* THE LOUD ONE — solid hot bar, pulsing dot. Unmissable. */
.inqbar{display:flex;align-items:center;gap:9px;background:var(--st-hot);color:var(--hot-text);
  border-radius:12px;padding:8px 12px;font-size:11.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase}
.inqbar .newpulse{background:var(--hot-text)}
.inqbar.quiet{background:var(--wash);color:var(--fg);opacity:.5;font-weight:600;text-transform:none;letter-spacing:0}
.newpulse{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#f0ede4;
  animation:np 1.6s ease-in-out infinite}
[data-theme="light"] .newpulse{background:rgba(42,39,34,.85)}
@keyframes np{0%,100%{opacity:.25}50%{opacity:1}}

/* ===== STUDIO CARDS (daily ops) ===== */
.stud{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:16px;cursor:pointer;
  background:var(--bg);
  box-shadow:inset 4px 4px 12px rgba(0,0,0,.35), inset -4px -4px 12px rgba(255,255,255,.03)}
[data-theme="light"] .stud{box-shadow:inset 4px 4px 12px rgba(42,39,34,.08), inset -4px -4px 12px rgba(255,255,255,.7)}
.stud .code{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.01em}
.stud .vn{font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.4}
.stud .cnt{display:flex;align-items:baseline;gap:6px;margin-top:5px}
.stud .n{font-family:'Archivo Black',sans-serif;font-size:22px;line-height:1}
.stud .u{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.45}
.stud .live{margin-left:auto;font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(67,223,174,.2);color:var(--st-booked);border-radius:99px;padding:2px 7px}
.stud.off .n{opacity:.35}

/* flags mini */
.flagmini{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:14px;cursor:pointer;
  background:var(--bg);
  box-shadow:inset 4px 4px 12px rgba(0,0,0,.35), inset -4px -4px 12px rgba(255,255,255,.03)}
[data-theme="light"] .flagmini{box-shadow:inset 4px 4px 12px rgba(42,39,34,.08), inset -4px -4px 12px rgba(255,255,255,.7)}
.flagmini .num{font-family:'Archivo Black',sans-serif;font-size:20px;line-height:1}
.flagmini .body{flex:1;min-width:0}
.flagmini .name{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;opacity:.5}
.flagmini .sub{font-size:10.5px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flagmini .go{font-size:8.5px;font-weight:800;text-transform:uppercase;opacity:.4;flex-shrink:0}

/* staff grid */
.dgrid table{border-collapse:separate;border-spacing:2px}
.dgrid .who{font-size:10px;font-weight:600;text-align:left;padding-right:7px;white-space:nowrap}
.dgrid td.sq{width:10px;height:10px;border-radius:3px;background:var(--wash2)}
.dgrid td.g{background:var(--st-booked)}
.dgrid td.r{background:var(--st-hot)}
.dgrid .bk{font-size:8px;font-weight:800;color:var(--st-hot);white-space:nowrap;padding-left:5px}

/* sessions */
.loccount{display:flex;gap:5px;flex-wrap:wrap}
.loccount span{font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:99px;padding:2.5px 7px;background:var(--wash2);opacity:.7}
.loccount span.live{background:rgba(67,223,174,.2);color:var(--st-booked);opacity:1}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{background:var(--wash);border-radius:13px;min-height:60px;padding:7px 10px;
  position:relative;display:flex;flex-direction:column}
.room .rn{font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.45;white-space:nowrap}
.room.book{background:rgba(67,223,174,.18)}
.room.book .rn{color:var(--st-booked);opacity:1}
.room.tent{background:rgba(255,169,77,.16)}
.room.tent .rn{color:var(--st-warm);opacity:1}
.room .artist{font-family:'Archivo Black',sans-serif;font-size:12px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .meta{font-size:9px;opacity:.65}
.room .eng{position:absolute;right:8px;bottom:5px;font-family:ui-monospace,Menlo,monospace;font-size:8px;opacity:.5}
.room.empty{opacity:.5}

.ctlbar{position:fixed;right:16px;bottom:14px;z-index:50;display:flex;gap:8px}
.ctl{background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 15px;font-size:9.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  box-shadow:3px 3px 10px rgba(0,0,0,.4)}
[data-theme="dark"] .ctl{background:var(--ivory);color:#1b1a17}
.ctl.dim{opacity:.55}
.optlbl{position:fixed;left:16px;bottom:14px;z-index:50;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;opacity:.5}
</style>
</head>
<body>

<div class="ctlbar">
  <button class="ctl" id="oA" onclick="setOpt('A')">A · command row</button>
  <button class="ctl dim" id="oB" onclick="setOpt('B')">B · signal rail</button>
  <button class="ctl dim" id="oC" onclick="setOpt('C')">C · studio strip</button>
  <button class="ctl" id="themeBtn" onclick="flip()">View light</button>
</div>
<div class="optlbl" id="optlbl"></div>

<div class="frame">
<nav class="rail">
  <span class="wm">PRS<span class="flo">FLO</span></span>
  <a class="on">▦ Dashboard</a><a>▤ Calendar</a><a>◔ Daily Ops</a>
  <a>◎ CRM</a><a>▽ WO Hub</a><a>✓ Tasks</a><a>⚑ Flags</a>
</nav>

<main class="main">
  <div class="hbar">
    <div>
      <span class="label" style="display:block;margin-bottom:3px">Good evening Eli</span>
      <h1>Paramount Recording Studios</h1>
    </div>
    <div class="grow"></div>
    <div class="datechip">FRI, AUG 7<small>6:46 PM</small></div>
  </div>

  <div id="content"></div>
</main>
</div>

<script>
/* ---- shared fragments ---- */
var FLO =
'<div class="ringwrap"><div class="inner fb">'
+'<div class="flohead"><svg width="20" height="20" viewBox="0 0 200 200" fill="none" style="flex-shrink:0">'
+'<path d="M 14 100 Q 70 -10, 113 100 T 186 100" stroke="currentColor" stroke-width="11" fill="none" stroke-linecap="round" opacity=".35"/>'
+'<path d="M 14 100 Q 70 30, 113 100 T 186 100" stroke="currentColor" stroke-width="11" fill="none" stroke-linecap="round" opacity=".6"/>'

+'<div><div class="subhead"><b>My day — duties</b><span class="prog">2 of 4</span></div>'
+'<div class="item done"><span class="bx"></span><span class="tx">Morning briefing reviewed</span></div>'
+'<div class="item done"><span class="bx"></span><span class="tx">Approve pending WOs</span><span class="ct">2 appr.</span></div>'
+'<div class="item"><span class="bx"></span><span class="tx">Review staff grid</span></div>'
+'<div class="item"><span class="bx"></span><span class="tx">Sign vendor invoices</span><span class="due">Due today</span></div></div>'

+'<div class="trow"><span class="dot" style="background:var(--wash2)"></span><span class="tx">Call SIR re: rental return</span></div>'
+'<div class="trow"><span class="dot" style="background:var(--wash2)"></span><span class="tx">Review Q3 rate sheet</span></div>'
+'<div class="trow"><span class="dot" style="background:var(--wash2)"></span><span class="tx">Book piano tuning — St. A</span></div>'
+'<div class="more">+ 4 more →</div>'
+'<div class="addrow">+ add task</div></div>'
+'</div>';

function pipe(big){
  return '<div class="pipe">'
  +'<div class="toprow"><span class="num"'+(big?' style="font-size:56px"':'')+'>5</span>'
  +'<div class="body"><div class="name">Pipeline</div>'

}

function stud(code,vn,n,live,off){
  return '<div class="stud'+(off?' off':'')+'">'
  +'<span class="code">'+code+'</span><span class="vn">'+vn+'</span>'
  +'<span class="cnt"><span class="n">'+n+'</span><span class="u">session'+(n===1?'':'s')+'</span>'
  +(live?'<span class="live">'+live+' live</span>':'')
  +'</span></div>';

var STUDROW = stud('PRS','Paramount',3,2) + stud('ARS','Ameraycan',1,1) + stud('ERS','Encore',1,0) + stud('TRK','Track',0,0,true);

var DGRID =

+'<tr><td class="who">Aaron</td><td class="sq g"></td><td class="sq g"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq r"></td><td class="sq g"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq r"></td><td class="sq r"></td><td class="bk">3d</td></tr>'
+'<tr><td class="who">Quinn</td><td class="sq g"></td><td class="sq g"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td></td></tr>'
+'<tr><td class="who">Sierra</td><td class="sq g"></td><td class="sq r"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td class="sq g"></td><td></td></tr>'
+'</table></div></div>';

var SESSIONS =
'<div class="pane">'
+'<div class="lozenge">Today’s sessions</div>'
+'<div style="display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px">'
+'<span class="loccount"><span class="live">PRS 3</span><span class="live">ARS 1</span><span class="live">ERS 1</span><span>TRK 0</span></span>'
+'<span class="mono" style="font-size:11px;opacity:.6">‹ &nbsp;Fri, Aug 7&nbsp; ›</span></div>'
+'<div class="rooms">'
+'<div class="room book"><span class="rn">PRS · A</span><div class="artist">Sable West</div><div class="meta">12P–8P</div><span class="eng">1ST-MR</span></div>'
+'<div class="room book"><span class="rn">PRS · B</span><div class="artist">Kestrel Music</div><div class="meta">2P–11P</div><span class="eng">1ST-XD</span></div>'
+'<div class="room empty"><span class="rn">PRS · C</span></div>'
+'<div class="room empty"><span class="rn">PRS · E</span></div>'
+'<div class="room tent"><span class="rn">PRS · X</span><div class="artist">Iris Vale</div><div class="meta">Hold · 6P–12A</div></div>'
+'<div class="room empty"><span class="rn">PRS · Nadine’s</span></div>'
+'<div class="room book"><span class="rn">ARS · A</span><div class="artist">Harbor Records</div><div class="meta">6P–2A</div><span class="eng">1ST-KV</span></div>'
+'<div class="room empty"><span class="rn">ARS · B</span></div>'
+'<div class="room tent"><span class="rn">ERS · A</span><div class="artist">Nova Beats</div><div class="meta">Hold · 12P–8P</div></div>'
+'<div class="room empty"><span class="rn">ERS · B</span></div>'
+'<div class="room empty"><span class="rn">TRK · N</span></div>'
+'<div class="room empty"><span class="rn">TRK · S</span></div>'
+'</div></div>';

var CONSOLE = '<div class="pane">' + FLO + TWOUP + '</div>';

/* ---- arrangements ---- */
var OPTS = {
A: {
  label:'Option A — command row: pipeline + studios on top',
  html:
   '<div style="display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px">'
   + pipe(false) + STUDROW
   +'</div>'
   +'<div style="display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:start">'
   +'<div style="display:flex;flex-direction:column;gap:12px">'
     + CONSOLE
     +'<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:end">'+DGRID+FLAGMINI+'</div>'
   +'</div>'
   + SESSIONS
   +'</div>'
},
B: {
  label:'Option B — signal rail: pipeline + studios down the left',
  html:
   '<div style="display:grid;grid-template-columns:.8fr 1.5fr 1.1fr;gap:12px;align-items:start">'
   +'<div style="display:flex;flex-direction:column;gap:12px">'
     + pipe(true)
     +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+STUDROW+'</div>'
     + FLAGMINI
   +'</div>'
   +'<div style="display:flex;flex-direction:column;gap:12px">'+CONSOLE+DGRID+'</div>'
   + SESSIONS
   +'</div>'
},
C: {
  label:'Option C — studio strip on top, pipeline in the middle column',
  html:
   '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px">'+STUDROW+'</div>'
   +'<div style="display:grid;grid-template-columns:1.35fr 1fr 1.1fr;grid-template-rows:auto 1fr;gap:12px;align-items:start">'
   +'<div style="grid-column:1;grid-row:1 / span 2">'+CONSOLE+'</div>'
   +'<div style="grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:12px">'+pipe(true)+FLAGMINI+'</div>'
   +'<div style="grid-column:2;grid-row:2;align-self:end">'+DGRID+'</div>'
   +'<div style="grid-column:3;grid-row:1 / span 2">'+SESSIONS+'</div>'
   +'</div>'
}
};

function setOpt(o){
  document.getElementById('content').innerHTML = OPTS[o].html;
  document.getElementById('optlbl').textContent = OPTS[o].label;
  ['A','B','C'].forEach(function(k){
    document.getElementById('o'+k).classList.toggle('dim', k!==o);
  });
}
function flip(){
  var h=document.documentElement;
  var next=h.getAttribute('data-theme')==='light'?'dark':'light';
  h.setAttribute('data-theme',next);
  document.getElementById('themeBtn').textContent = next==='light'?'View dark':'View light';
}
setOpt('A');
</script>
</body>
</html>
